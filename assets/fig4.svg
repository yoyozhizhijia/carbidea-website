<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" font-family="Helvetica, Arial, sans-serif">
  <title>HRA to HV hardness reference</title>
  <desc>Approximate hardness conversion for common cemented carbide grades</desc>
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F4F7FB"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="720" height="320" rx="16" fill="url(#bgGrad)"/>
  <text x="40" y="36" font-size="15" font-weight="bold" fill="#1E293B">HRA to HV Hardness Reference</text>

  <g font-size="10" fill="#64748B" font-weight="bold">
    <text x="40" y="58">TYPICAL GRADE</text>
    <text x="200" y="58">HARDNESS (HRA)</text>
    <text x="560" y="58">APPROX. HV</text>
  </g>
  <line x1="40" y1="64" x2="680" y2="64" stroke="#E2E8F0" stroke-width="1"/>

  <g>
    <text x="40" y="88" font-size="11" font-weight="bold" fill="#1E293B">YG20</text>
    <text x="40" y="102" font-size="9" fill="#94A3B8">20% Co</text>
    <rect x="200" y="82" width="43" height="14" rx="7" fill="url(#barGrad)"/>
    <text x="251" y="93" font-size="10" font-weight="bold" fill="#2563EB">82</text>
    <text x="560" y="93" font-size="10.5" fill="#475569">~950</text>
  </g>
  <g>
    <text x="40" y="128" font-size="11" font-weight="bold" fill="#1E293B">YG15</text>
    <text x="40" y="142" font-size="9" fill="#94A3B8">15% Co</text>
    <rect x="200" y="122" width="161" height="14" rx="7" fill="url(#barGrad)"/>
    <text x="369" y="133" font-size="10" font-weight="bold" fill="#2563EB">87.5</text>
    <text x="560" y="133" font-size="10.5" fill="#475569">~1250</text>
  </g>
  <g>
    <text x="40" y="168" font-size="11" font-weight="bold" fill="#1E293B">YG8</text>
    <text x="40" y="182" font-size="9" fill="#94A3B8">8% Co</text>
    <rect x="200" y="162" width="205" height="14" rx="7" fill="url(#barGrad)"/>
    <text x="413" y="173" font-size="10" font-weight="bold" fill="#2563EB">89.5</text>
    <text x="560" y="173" font-size="10.5" fill="#475569">~1450</text>
  </g>
  <g>
    <text x="40" y="208" font-size="11" font-weight="bold" fill="#1E293B">YG6</text>
    <text x="40" y="222" font-size="9" fill="#94A3B8">6% Co</text>
    <rect x="200" y="202" width="215" height="14" rx="7" fill="url(#barGrad)"/>
    <text x="423" y="213" font-size="10" font-weight="bold" fill="#2563EB">90.0</text>
    <text x="560" y="213" font-size="10.5" fill="#475569">~1500</text>
  </g>
  <g>
    <text x="40" y="248" font-size="11" font-weight="bold" fill="#1E293B">YG6X</text>
    <text x="40" y="262" font-size="9" fill="#94A3B8">fine grain</text>
    <rect x="200" y="242" width="248" height="14" rx="7" fill="url(#barGrad)"/>
    <text x="456" y="253" font-size="10" font-weight="bold" fill="#2563EB">91.5</text>
    <text x="560" y="253" font-size="10.5" fill="#475569">~1650</text>
  </g>

  <line x1="40" y1="286" x2="680" y2="286" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="304" font-size="9.5" fill="#94A3B8">Approximate conversion — industry reference values. Bar length indicates relative hardness (HRA).</text>
</svg>
