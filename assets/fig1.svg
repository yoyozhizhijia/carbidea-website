<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="100%" font-family="Helvetica, Arial, sans-serif">
  <title>Carbide hardness vs toughness trade-off</title>
  <desc>Hardness (HRA) decreases while transverse rupture strength (MPa) increases with higher cobalt content</desc>
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F7FB"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="720" height="430" rx="16" fill="url(#bgGrad)"/>
  <text x="40" y="38" font-size="15" font-weight="bold" fill="#1E293B">Hardness vs. Toughness by Cobalt Content</text>

  <line x1="80" y1="60" x2="80" y2="330" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="80" y1="330" x2="660" y2="330" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="660" y1="60" x2="660" y2="330" stroke="#CBD5E1" stroke-width="0.6" stroke-dasharray="3,3"/>

  <g stroke="#E2E8F0" stroke-width="0.6">
    <line x1="80" y1="127.5" x2="660" y2="127.5"/>
    <line x1="80" y1="195" x2="660" y2="195"/>
    <line x1="80" y1="262.5" x2="660" y2="262.5"/>
  </g>

  <g font-size="10" fill="#64748B" text-anchor="end">
    <text x="72" y="63">95</text>
    <text x="72" y="130">90</text>
    <text x="72" y="198">85</text>
    <text x="72" y="265">80</text>
    <text x="72" y="333">75</text>
  </g>
  <g font-size="10" fill="#64748B">
    <text x="672" y="63">3000</text>
    <text x="672" y="130">2500</text>
    <text x="672" y="198">2000</text>
    <text x="672" y="265">1500</text>
  </g>
  <text x="40" y="345" font-size="10.5" fill="#475569">Hardness (HRA)</text>
  <text x="672" y="345" font-size="10.5" fill="#475569" text-anchor="end">Transverse rupture strength (MPa)</text>

  <g>
    <rect x="110" y="127.5" width="70" height="202.5" rx="6" fill="url(#barGrad)"/>
    <rect x="260" y="134.25" width="70" height="195.75" rx="6" fill="url(#barGrad)"/>
    <rect x="410" y="161.25" width="70" height="168.75" rx="6" fill="url(#barGrad)"/>
    <rect x="560" y="235.5" width="70" height="94.5" rx="6" fill="url(#barGrad)"/>
  </g>

  <g font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="145" y="135">90.0</text>
    <text x="295" y="142">89.5</text>
    <text x="445" y="169">87.5</text>
    <text x="595" y="243">82.0</text>
  </g>

  <polyline points="145,222 295,168 445,150 595,123" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#0F172A">
    <circle cx="145" cy="222" r="5"/>
    <circle cx="295" cy="168" r="5"/>
    <circle cx="445" cy="150" r="5"/>
    <circle cx="595" cy="123" r="5"/>
  </g>
  <g font-size="10.5" fill="#0F172A" text-anchor="start" font-weight="bold">
    <text x="188" y="212">2100</text>
    <text x="338" y="158">2400</text>
    <text x="488" y="140">2500</text>
    <text x="638" y="113">2650</text>
  </g>

  <g font-size="11" fill="#1E293B" text-anchor="middle" font-weight="500">
    <text x="145" y="360">YG6</text>
    <text x="295" y="360">YG8</text>
    <text x="445" y="360">YG15</text>
    <text x="595" y="360">YG20</text>
    <g font-size="9.5" fill="#64748B">
      <text x="145" y="376">6% Co</text>
      <text x="295" y="376">8% Co</text>
      <text x="445" y="376">15% Co</text>
      <text x="595" y="376">20% Co</text>
    </g>
  </g>
  <text x="340" y="400" text-anchor="middle" font-size="10" fill="#64748B">Grade (cobalt content)</text>

  <g transform="translate(440, 24)">
    <rect x="0" y="0" width="250" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="8" y="6" width="12" height="14" rx="3" fill="url(#barGrad)"/>
    <text x="26" y="17" font-size="10" fill="#334155">Hardness (HRA)</text>
    <line x1="128" y1="8" x2="148" y2="18" stroke="#0F172A" stroke-width="2"/>
    <circle cx="148" cy="18" r="2.5" fill="#0F172A"/>
    <text x="158" y="17" font-size="10" fill="#334155">TRS (MPa)</text>
  </g>
</svg>
